name: Agent Structure Check

on:
  pull_request:
    paths:
      - 'src/agentware/agents/**'
      - 'examples/**'
      - 'tests/agents/**'
      - 'tests/core/test_agent_structure.py'
      - 'pyproject.toml'
      - '.github/workflows/agent-structure-check.yml'

jobs:
  check-agent-structure:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run agent structure tests
        run: pytest tests/core/test_agent_structure.py -v

      - name: Comment PR on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Agent Structure Check Failed**\n\nYour PR does not meet the agent structure requirements. Please ensure:\n- Each agent has `README.md`, `__init__.py`, and `agent.py`\n- Each agent has example files in `examples/<agent_name>/`\n- Each agent has test files in `tests/agents/<agent_name>/`\n\nRun `pytest tests/core/test_agent_structure.py -v` locally to see details.'
            })

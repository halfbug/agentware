[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentware"
version = "0.1.0"
description = "Extensible multi-agent framework on LangGraph with token tracking and MCP tool support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["langchain", "langgraph", "agents", "mcp", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
mcp = ["langchain-mcp-adapters>=0.1.0"]
mongodb = ["langgraph-checkpoint-mongodb>=0.1.0", "pymongo>=4.0"]
fastapi = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/halfbug/agentware"
Repository = "https://github.com/halfbug/agentware"
Documentation = "https://github.com/halfbug/agentware#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/agentware"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
